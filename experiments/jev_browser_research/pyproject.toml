[project]
name = "tune-lease-jev-browser-research"
version = "0.1.0"
description = "Isolated Jev Ultrafast browser-research pilot"
requires-python = ">=3.12"
dependencies = [
    "jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast.git@1231850a0bf1a0c0341fe408ef1668dbbfdfac46",
]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
