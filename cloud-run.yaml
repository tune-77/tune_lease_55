apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: tune-lease-55
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/targetCPUUtilizationPercentage: "60"
    spec:
      serviceAccountName: tune-lease-55
      containers:
        - image: gcr.io/PROJECT_ID/tune-lease-55:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 512Mi
            requests:
              cpu: "0.5"
              memory: 256Mi
          env:
            - name: PORT
              value: "8080"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: ENABLE_OBSIDIAN_INDEXING
              value: "false"
            - name: ENABLE_FEEDBACK_LOADING
              value: "false"
            - name: ENABLE_GUNSHI_RAG
              value: "false"
      timeoutSeconds: 300
      idleTimeoutSeconds: 3600
  traffic:
    - percent: 100
      latestRevision: true
