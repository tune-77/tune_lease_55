name: PR Checks

# PR前チェックリスト（tsc --noEmit / npm run lint）の自動化。
# eslint は必ずチェックのみ（--fix 禁止: .claude/rules/frontend.md 参照）
#
# Phase 0.5（planning/shion_improvement_loop_plan.md）:
# master への直接push（Codex経由の直コミット等）はPRを経由せずCI未実行のまま
# 本番コードに入っていたため、push トリガーでも同じチェックを実行する。
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: TypeScript check (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint check (no --fix)
        working-directory: frontend
        run: npm run lint

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check (compileall)
        run: python -m compileall -q api scripts tests *.py

  # Python回帰テストをPRごとに全件実行する。実Vault・外部サービスへ接続する
  # externalテストだけを除外し、テスト追加時のCI登録漏れを防ぐ。
  # ジョブIDは既存のbranch protectionとの互換性のためpytest-coreを維持する。
  pytest-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: >
          pip install -q pytest fastapi uvicorn pydantic slowapi httpx python-multipart
          requests numpy pandas matplotlib seaborn scipy scikit-learn joblib
          python-dateutil pyyaml beautifulsoup4 filelock bcrypt flask flask-cors
          google-api-core lxml toml chromadb google-adk

      - name: Run full Python test suite
        run: python -m pytest -q -m "not external"

  # #863/#864/#865/#866 の危険域専用ガード。
  # Cloud Run実データ登録、APIアクセス制御、GCS DBスナップショット/復元、
  # score_input昇格の再発バグを通常CIとは別名の必須チェックとして見える化する。
  cloudrun-data-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install safety test dependencies
        run: >
          pip install -q pytest fastapi uvicorn pydantic slowapi httpx python-multipart
          requests numpy pandas matplotlib seaborn scipy scikit-learn joblib
          python-dateutil pyyaml

      - name: Run Cloud Run data safety suite
        run: >
          python -m pytest -q
          tests/test_cloudrun_db_snapshot.py
          tests/test_api_key_auth.py
          tests/test_promote_cloudrun_return_data.py
          tests/test_cloudrun_data_safety_audit.py

  # PR前プリフライト検証ガード（AST / 幻覚import / リトライ）。
  # 対話セッション経由だけでなく、自律パイプラインが作る PR も含め全経路を対象化する。
  # pull_request では strict（警告があれば失敗）、master push では既存運用保護のため warn-only。
  preflight-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # resolve_base_ref() が origin/master との merge-base を要求するため全履歴取得

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install preflight dependencies
        run: pip install -q pyflakes

      - name: Preflight guard (strict on PR)
        if: github.event_name == 'pull_request'
        run: |
          python scripts/preflight_pr_guard.py --strict | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Preflight guard (warn-only on master push)
        if: github.event_name == 'push'
        run: |
          python scripts/preflight_pr_guard.py | tee -a "$GITHUB_STEP_SUMMARY" || true

  # 生成物混入と過大PRを検知する。pull_request では strict、master push では
  # post-merge 観測として warn-only にする。
  pr-change-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: PR change risk guard (strict on PR)
        if: github.event_name == 'pull_request'
        run: |
          python scripts/check_pr_change_risk.py --base origin/master...HEAD --max-files 80 --max-text-changes 2500 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: PR change risk guard (warn-only on master push)
        if: github.event_name == 'push'
        run: |
          python scripts/check_pr_change_risk.py --base HEAD~1..HEAD --max-files 80 --max-text-changes 2500 | tee -a "$GITHUB_STEP_SUMMARY" || true

  # Obsidian Vault パス解決の整合性 + マシン依存の絶対パス直書きを検査する。
  # 既知の直書きは許可リスト方式で許容し、リストにない新規の直書きだけを
  # ERROR として CI を失敗させる（scripts/check_obsidian_ops_consistency.py 参照）。
  # スクリプトは stdlib のみで動くため追加依存は不要。
  obsidian-ops-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Obsidian ops consistency check
        run: python scripts/check_obsidian_ops_consistency.py

  # フロント(frontend/src/types/index.ts ScoringFormData)とバックエンド
  # (api/schemas.py ScoringRequest)のフィールド名の配線漏れ・型不一致を検知する
  # （scripts/check_frontend_backend_schema.py 参照）。
  # 金額フィールドは frontend/src/lib/scoringUnits.ts の monetaryScoringFields
  # に載っているものだけ百万円→千円へ変換される。追加漏れは審査スコアが
  # 桁違いのまま計算される静かなバグになるため strict（CIを失敗させる）。
  # スクリプトは stdlib のみで動くため追加依存は不要。
  schema-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Frontend/backend schema consistency check
        run: python scripts/check_frontend_backend_schema.py | tee -a "$GITHUB_STEP_SUMMARY"

  # 日次改善パイプライン(run_daily_improvement_*.sh)のシェルスクリプト静的解析。
  # REV-DAILY-PIPELINE-PROJECT-ROOT-EXPORT: PROJECT_ROOT を export し忘れて
  # core.sh/post.sh に渡らず、ハードコード既定値へ常にフォールバックしていた
  # バグの再発防止として追加。--severity=error のみに絞り、既存のstyle/warning
  # 指摘（例: EXPORT_FILE未export）でCIを赤くしないようにする。ubuntu-latest には
  # shellcheck がプリインストールのため追加インストール不要。
  shellcheck-daily-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck (daily pipeline scripts, error severity only)
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          shellcheck --shell=bash --severity=error -x -P scripts \
            scripts/run_daily_improvement_pipeline.sh \
            scripts/run_daily_improvement_core.sh \
            scripts/run_daily_improvement_post.sh \
            scripts/pipeline_log_step.sh \
            scripts/resolve_obsidian_vault.sh

  # scripts/*.py の中で、どのパイプライン・ワークフロー・他スクリプトからも
  # 呼ばれていないものを検知する（scripts/check_orphaned_scripts.py 参照）。
  # cron/launchd 等リポジトリ外からの呼び出しは検知できず誤検知しうるため、
  # 常に warn-only（CIを失敗させない）で $GITHUB_STEP_SUMMARY に出すだけ。
  orphaned-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Orphaned scripts audit (warn-only)
        run: |
          python scripts/check_orphaned_scripts.py --dry-run | tee -a "$GITHUB_STEP_SUMMARY" || true
