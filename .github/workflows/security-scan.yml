name: Security Scan

on:
  schedule:
    - cron: "0 2 * * *"  # 毎日 02:00 UTC（JST 11:00）
  push:
    branches: [master]
    paths:
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"
      - "frontend/package*.json"
  workflow_dispatch: {}

jobs:
  python-security:
    name: Python Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install safety
        run: pip install -q safety

      - name: Check Python dependencies
        run: |
          echo "🔍 Python パッケージの脆弱性チェック..."
          set +e
          safety check --json --output report.json
          status=$?
          set -e
          cat report.json || echo "No vulnerabilities found"
          exit "${status}"

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          workflow-name: "Security Scan / python-security"

  npm-security:
    name: NPM Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --production --audit-level=moderate

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          workflow-name: "Security Scan / npm-security"

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Dependency-Check
        # main は未タグのブランチ参照で、上流の破壊的変更が無警告でCIを壊しうるため
        # 具体的なコミットSHAに固定する（2026-09-14時点のmain HEAD）。
        # 更新する場合: git ls-remote https://github.com/dependency-check/Dependency-Check_Action.git main
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        with:
          project: 'tune-lease-55'
          path: '.'
          format: 'JSON'
          args: >
            --scan .
            --exclude "node_modules,venv,.venv,tests,__pycache__,.git"

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          workflow-name: "Security Scan / dependency-check"
