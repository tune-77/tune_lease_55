name: Daily Test Suite

on:
  schedule:
    - cron: "0 3 * * *"  # 毎日 03:00 UTC（JST 12:00）
  workflow_dispatch: {}

jobs:
  full-pytest:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: >
          pip install -q pytest pytest-cov fastapi uvicorn pydantic slowapi httpx python-multipart
          requests numpy pandas matplotlib seaborn scipy scikit-learn==1.7.2 joblib
          python-dateutil pyyaml beautifulsoup4 filelock bcrypt flask flask-cors
          google-api-core lxml toml chromadb google-adk apscheduler

      - name: Run full test suite with coverage
        run: |
          set -o pipefail
          python -m pytest tests/ -m "not external" \
            -v --tb=short --cov=. --cov-report=term-missing \
            --cov-report=json --cov-report=html \
            2>&1 | tee test-report.txt

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.json
            htmlcov/

      - name: Comment on failures
        if: failure()
        run: |
          echo "⚠️ Daily test suite に失敗がありました" >> $GITHUB_STEP_SUMMARY
          echo "詳細は Actions タブを確認してください" >> $GITHUB_STEP_SUMMARY

  lint-full:
    name: Full Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run full ESLint
        working-directory: frontend
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-report.txt

      - name: Python Lint
        run: |
          set -o pipefail
          pip install -q pylint flake8
          flake8 api scripts tests *.py --max-line-length=120 2>&1 | tee flake8-report.txt
