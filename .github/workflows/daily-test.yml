name: Daily Test Suite

on:
  schedule:
    - cron: "0 3 * * *"  # 毎日 03:00 UTC（JST 12:00）
  workflow_dispatch: {}

jobs:
  full-pytest:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: >
          pip install -q pytest pytest-cov fastapi uvicorn pydantic slowapi httpx python-multipart
          requests numpy pandas matplotlib seaborn scipy scikit-learn==1.7.2 joblib
          python-dateutil pyyaml beautifulsoup4 filelock bcrypt flask flask-cors
          google-api-core lxml toml chromadb google-adk apscheduler

      - name: Run full test suite with coverage
        run: |
          set -o pipefail
          python -m pytest tests/ -m "not external" \
            -v --tb=short --cov=. --cov-report=term-missing \
            --cov-report=json --cov-report=html \
            2>&1 | tee test-report.txt

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.json
            htmlcov/

      - name: Comment on failures
        if: failure()
        run: |
          echo "⚠️ Daily test suite に失敗がありました" >> $GITHUB_STEP_SUMMARY
          echo "詳細は Actions タブを確認してください" >> $GITHUB_STEP_SUMMARY

  # 判断資産フィードバックループの定期チェック（REV-365）。
  # full-pytest でも同じテストは回るが、この経路が壊れた時に
  # 「Daily Test Suite が赤い」ではなく「判断資産ループが赤い」と分かるように
  # 名前を分けて出す。数週間 field_validation が 0 のまま気づけなかった再発防止。
  judgment-asset-loop:
    name: Judgment Asset Loop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install judgment asset loop test dependencies
        run: >
          pip install -q pytest fastapi uvicorn pydantic slowapi httpx python-multipart
          requests numpy pandas matplotlib seaborn scipy scikit-learn joblib
          python-dateutil pyyaml

      - name: Run judgment asset feedback loop suite
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_judgment_asset_feedback_loop_e2e.py \
            tests/test_judgment_asset_feedback_drop_log.py \
            tests/test_screening_judgment_asset_selection.py \
            tests/test_judgment_asset_growth_report.py \
            tests/test_build_judgment_asset_field_review.py \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Explain failure
        if: failure()
        run: |
          {
            echo "### 判断資産フィードバックループが壊れています"
            echo ""
            echo "守っている不変条件: 正規判断資産が候補に出る → 出典が本文に残る"
            echo "→ 評価が rule_id へ紐付く → field_validation が 0 より大きくなる"
            echo ""
            echo "このどこかが切れると、UIは動いたまま field_validation だけが静かに 0 へ戻ります。"
            echo "詳細は tests/test_judgment_asset_feedback_loop_e2e.py の docstring を参照。"
          } >> "$GITHUB_STEP_SUMMARY"

  lint-full:
    name: Full Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run full ESLint
        working-directory: frontend
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-report.txt

      - name: Python Lint
        run: |
          set -o pipefail
          pip install -q pylint flake8
          flake8 api scripts tests *.py --max-line-length=120 2>&1 | tee flake8-report.txt
