name: Docker Image Security Scan

on:
  schedule:
    - cron: "0 4 * * *"  # 毎日 04:00 UTC（JST 13:00）
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - "Dockerfile.api"
      - "pyproject.toml"
      - "requirements.txt"
      - "frontend/package*.json"
  workflow_dispatch: {}

jobs:
  build-and-scan:
    name: Build Docker Image & Scan for Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t tune-lease-55:latest .

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tune-lease-55:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: Scan with Docker Scout
        run: |
          echo "🔍 Docker Scout スキャンを実行..."
          docker scout cves tune-lease-55:latest --format=list 2>&1 || true

  scan-dockerfile:
    name: Dockerfile Best Practices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3009

      - name: Lint Dockerfile.api
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.api
          ignore: DL3008,DL3009
