name: Knowledge Sync Health

on:
  schedule:
    # 2時間おき27分。min-instances=0のためこのプローブ自体がCloud Run
    # (web→proxy.ts経由でapiまで)のコールドスタートを毎回誘発しており、
    # Cloud Run課金増の一因だったため毎時→2時間おきに頻度を落とした
    # （2026-09、Cloud Run費用調査で判明）。Vault同期・デプロイ直後の
    # 一時状態を避ける狙いは維持。
    - cron: "27 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-sync-health
  cancel-in-progress: true

jobs:
  check-knowledge-sync:
    name: Detect incomplete Vault to ChromaDB sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check production knowledge sync
        env:
          KNOWLEDGE_SYNC_PROBE_TOKEN: ${{ secrets.KNOWLEDGE_SYNC_PROBE_TOKEN }}
        run: |
          python scripts/check_cloudrun_knowledge_sync.py \
            --base-url "https://tune-lease-55-web-6mijhyebkq-an.a.run.app" \
            --path "/api/system/knowledge-sync-health" \
            --attempts 3 \
            --retry-delay 15 \
            --timeout 20

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          workflow-name: "Knowledge Sync Health"
