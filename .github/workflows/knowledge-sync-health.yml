name: Knowledge Sync Health

on:
  schedule:
    # 毎時27分。Vault同期・デプロイ直後の一時状態を避ける。
    - cron: "27 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-sync-health
  cancel-in-progress: true

jobs:
  check-knowledge-sync:
    name: Detect incomplete Vault to ChromaDB sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check production knowledge sync
        run: |
          python scripts/check_cloudrun_knowledge_sync.py \
            --base-url "https://tune-lease-55-web-6mijhyebkq-an.a.run.app" \
            --attempts 3 \
            --retry-delay 15 \
            --timeout 20
