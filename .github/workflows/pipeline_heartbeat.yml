name: Pipeline Heartbeat

on:
  repository_dispatch:
    types: [daily-improvement-completed]
  schedule:
    - cron: "0 6 * * *" # 毎日15:00 JST。Macの早朝パイプライン完了後に確認する。
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: pipeline-heartbeat-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  record-heartbeat:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Record successful daily pipeline completion
        run: echo "Daily improvement pipeline completion signal received."

  check-heartbeat:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_AGE_HOURS: "36"
    steps:
      - name: Check latest completion signal
        run: |
          set -euo pipefail

          COMPLETED_AT="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/pipeline_heartbeat.yml/runs?event=repository_dispatch&status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // ""')"

          if [ -z "${COMPLETED_AT}" ]; then
            echo "::error::成功した日次改善パイプラインheartbeatが見つかりません。"
            exit 1
          fi

          AGE_H="$(python3 -c 'import sys, datetime; completed = datetime.datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00")); print(int((datetime.datetime.now(datetime.timezone.utc) - completed).total_seconds() // 3600))' "${COMPLETED_AT}")"
          echo "Latest pipeline heartbeat: ${COMPLETED_AT} (${AGE_H}h ago)"

          if [ "${AGE_H}" -gt "${MAX_AGE_HOURS}" ]; then
            echo "::error::日次改善パイプラインの成功通知が ${AGE_H}h 届いていません（閾値 ${MAX_AGE_HOURS}h）。Mac、launchd、またはpipeline_heartbeat_dispatchを確認してください。"
            exit 1
          fi
