name: Ledger Sync

on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  sync-ledger:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # PAT (LEDGER_SYNC_PAT) を廃止し、既定の GITHUB_TOKEN で完結させる。
    # ブランチ作成・push に contents:write、PR作成・auto-merge に pull-requests:write が要る。
    permissions:
      contents: write
      pull-requests: write

    steps:
      # 旧構成は PAT で checkout していたが、PAT の未設定/期限切れで
      # push が 403 になり 2026-08-15 以降のマージ全件（30回連続）で失敗し、
      # 台帳更新が毎回捨てられていた。シークレット1個の寿命に依存させない。
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run cleanup_improvement_reviews --apply
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_PATH: ${{ github.workspace }}/scripts/improvement_ledger.jsonl
        run: |
          python3 scripts/cleanup_improvement_reviews.py --apply

      # GITHUB_TOKEN が作った PR では GitHub の再帰防止により pull_request が
      # 発火せず pr-checks.yml が走らない。台帳PRだけ無検査で流れるのを防ぐため、
      # PR を作る前にこの場で台帳を検査する（壊れた追記・既存行の破壊を弾く）。
      - name: Validate ledger
        run: |
          python3 scripts/validate_improvement_ledger.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Open PR with updated ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/improvement_ledger.jsonl
          if git diff --cached --quiet; then
            echo "No ledger changes to commit"
            exit 0
          fi

          PR_NUM="${{ github.event.pull_request.number }}"
          BRANCH="chore/ledger-sync-pr-${PR_NUM}"

          git checkout -b "$BRANCH"
          git commit -m "chore: ledger sync after PR #${PR_NUM} merge"
          git push origin "$BRANCH"

          BODY=$(cat <<EOF
          PR #${PR_NUM} merge後の \`cleanup_improvement_reviews.py --apply\` による自動更新です。

          このPRは GITHUB_TOKEN で作成されているため、GitHub の再帰防止により \`pr-checks.yml\` は起動しません。
          代わりに ledger-sync ジョブ内で \`scripts/validate_improvement_ledger.py\` による検査を通しています。
          EOF
          )

          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "chore: ledger sync after PR #${PR_NUM} merge" \
            --body "$BODY"

          # auto-merge が無効（設定なし等）でも失敗させない。マージできなくても
          # PR さえ残れば台帳更新は失われない = 旧構成の「毎回捨てられる」より安全。
          if ! gh pr merge "$BRANCH" --auto --squash --delete-branch; then
            echo "::warning::auto-merge を有効化できませんでした。台帳PR ($BRANCH) は手動マージが必要です"
            {
              echo "### 台帳PRは手動マージが必要です"
              echo "ブランチ: \`$BRANCH\`"
              echo "auto-merge を有効化できませんでしたが、更新内容はPRとして保全されています。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
