name: Ledger Sync

on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  sync-ledger:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # PAT (LEDGER_SYNC_PAT) を廃止し、既定の GITHUB_TOKEN で完結させる。
    # ブランチ作成・push に contents:write、PR作成・auto-merge に pull-requests:write が要る。
    permissions:
      contents: write
      pull-requests: write
    env:
      SYNC_BRANCH: chore/ledger-sync

    steps:
      # 旧構成は PAT で checkout していたが、PAT の未設定/期限切れで
      # push が 403 になり 2026-08-15 以降のマージ全件（30回連続）で失敗し、
      # 台帳更新が毎回捨てられていた。シークレット1個の寿命に依存させない。
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run cleanup_improvement_reviews --apply
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_PATH: ${{ github.workspace }}/scripts/improvement_ledger.jsonl
        run: |
          python3 scripts/cleanup_improvement_reviews.py --apply

      # GITHUB_TOKEN が作った PR では GitHub の再帰防止により pull_request が
      # 発火せず pr-checks.yml が走らない。台帳PRだけ無検査で流れるのを防ぐため、
      # PR を作る前にこの場で台帳を検査する（壊れた追記・既存行の破壊を弾く）。
      - name: Validate ledger
        run: |
          python3 scripts/validate_improvement_ledger.py | tee -a "$GITHUB_STEP_SUMMARY"

      # PR1本につき1ブランチ（chore/ledger-sync-pr-<番号>）を作る旧方式は、
      # PR作成が拒否されるたびにブランチだけが残り 132 本まで積み上がった。
      # 台帳は毎回 master から全再計算されるので履歴を分けて持つ意味がなく、
      # 常に同じ1本（chore/ledger-sync）へ上書きする。
      - name: Push ledger update to the sync branch
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/improvement_ledger.jsonl
          if git diff --cached --quiet; then
            echo "No ledger changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -b "$SYNC_BRANCH"
          git commit -m "chore: ledger sync (PR #${{ github.event.pull_request.number }} まで反映)"
          # 内容は master からの再計算結果そのものなので、残っている旧内容は捨ててよい。
          git push --force origin "$SYNC_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # ここで緑のまま終わらせない。旧方式は PR 作成が拒否されても exit 0 で
      # 緑になっていたため、PR #797 以降 127 回のマージで台帳が master へ入って
      # いないことに誰も気づけなかった。master へ入る経路が無い状態は赤にする。
      - name: Ensure the ledger PR is open
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            echo "既存の台帳PR #${EXISTING} を更新しました（マージすれば master へ反映されます）" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BODY=$(printf '%s\n' \
            "マージ済みPRから \`cleanup_improvement_reviews.py --apply\` が再計算した改善台帳です。" \
            "" \
            "このPRは \`$SYNC_BRANCH\` 1本を上書きし続ける形で更新されます。" \
            "GITHUB_TOKEN 作成のPRでは再帰防止により pr-checks.yml が起動しないため、" \
            "ledger-sync ジョブ内で validate_improvement_ledger.py を通しています。")

          if gh pr create --base master --head "$SYNC_BRANCH" \
            --title "chore: ledger sync" --body "$BODY"; then
            exit 0
          fi

          {
            echo "### 台帳が master へ入る経路がありません"
            echo ""
            echo "更新内容はブランチ \`$SYNC_BRANCH\` に保全されていますが、PRが無いため master へ入りません。"
            echo ""
            echo "- 今すぐ入れる: https://github.com/${GITHUB_REPOSITORY}/pull/new/$SYNC_BRANCH からPRを作ってマージ"
            echo "- 恒久対応: Settings → Actions → General → Workflow permissions →"
            echo "  「Allow GitHub Actions to create and approve pull requests」を有効化すると全自動になります"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::台帳更新が $SYNC_BRANCH に滞留しています（PRを作成できませんでした）"
          exit 1
