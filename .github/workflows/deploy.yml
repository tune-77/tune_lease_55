# .github/workflows/deploy.yml
#
# REV-215: api/ または frontend/ 変更を検知して Cloud Run に自動デプロイ
# 2026-09: push毎の即時デプロイから週次(月曜4:00 JST)cronへ変更。
#   理由: masterへのpush毎に毎回ビルド・デプロイが走ると、まだ検証中の
#   小さな変更でもCloud Buildコストと本番反映頻度が積み上がるため、
#   週1回にまとめて「差分があるときだけ」デプロイする運用に変更した。
#   緊急修正が必要な場合は workflow_dispatch（force_deploy）で手動実行する。
#
# ──────────────────────────────────────────────────────────────────────
#  対象サービス
#    api/**    → tune-lease-55-api   (FastAPI)
#    frontend/** → tune-lease-55-web (Next.js)
#
#  認証: Workload Identity Federation (WIF) を使用
#    必要な GitHub Secrets:
#      WIF_PROVIDER         例) projects/XXXXXXXX/locations/global/workloadIdentityPools/github-pool/providers/github
#      WIF_SERVICE_ACCOUNT  例) cloud-run-deployer@gen-lang-client-0420497423.iam.gserviceaccount.com
#      CLOUDSQL_INSTANCE    任意。例) gen-lang-client-0420497423:asia-northeast1:tune-lease-db
#
#    WIF が未設定の場合は下記 "Alternative: SA Key" コメントを参照。
#
#  WIF のセットアップ手順:
#    https://cloud.google.com/blog/products/identity-security/enabling-keyless-authentication-from-github-actions
#
#  必要な IAM ロール（サービスアカウントに付与）:
#    roles/run.admin
#    roles/storage.admin
#    roles/cloudbuild.builds.builder
#    roles/artifactregistry.writer
#    roles/iam.serviceAccountUser
# ──────────────────────────────────────────────────────────────────────

name: Deploy to Cloud Run

on:
  schedule:
    # 毎週日曜 19:00 UTC = 月曜 4:00 JST。push トリガーは廃止済み。
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "コード差分なし（ワークフロー変更のみ等）でも deploy-api / deploy-web を強制実行する"
        type: boolean
        required: false
        default: false

env:
  PROJECT_ID: gen-lang-client-0420497423
  REGION: asia-northeast1

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Job 1: どのパスが変更されたか検出
  # ────────────────────────────────────────────────────────────────────
  changes:
    # schedule イベントには push の before/after SHA が無く dorny/paths-filter が
    # 使えないため、「Cloud Run で現在稼働中のイメージのタグ(=デプロイ済みコミットSHA)」
    # と HEAD の git diff で判定する（scripts/smart_deploy.sh と同じ考え方）。
    name: Detect changes since last deployed image
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      wif: ${{ steps.wif.outputs.configured }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # デプロイ済みコミットまで遡って diff するため全履歴が必要

      # WIF Secrets 未設定なら deploy ジョブをスキップ扱いにする（失敗表示を出さない）。
      # secrets コンテキストは job レベルの if: では参照できないため、ここで存在確認して
      # output に落とし、下流ジョブの if: で判定する。手動デプロイ運用時のノイズ防止。
      - id: wif
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        run: |
          if [ -n "${WIF_PROVIDER}" ] && [ -n "${WIF_SERVICE_ACCOUNT}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WIF Secrets (WIF_PROVIDER / WIF_SERVICE_ACCOUNT) が未設定のため Cloud Run 自動デプロイをスキップします。手動デプロイ（scripts/deploy_cloud_run_api.sh 等）を使用してください。"
          fi

      # changed_files_between/classify_changes と同じ考え方をここでも使うため、
      # イメージタグの取得に GCP 認証が要る（旧実装では deploy-api/deploy-web の
      # 中でしか認証していなかったが、schedule 実行では changes ジョブ自身が
      # 「今何がデプロイされているか」を知る必要がある）。
      - name: Authenticate to GCP
        if: steps.wif.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: steps.wif.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Detect changes since last deployed image
        id: filter
        if: steps.wif.outputs.configured == 'true'
        env:
          REGION: ${{ env.REGION }}
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy }}
        run: |
          set -Eeuo pipefail

          # 稼働中イメージのタグ（＝デプロイ時の短縮コミットSHA）を取得する。
          # scripts/smart_deploy.sh の service_image_tag() と同じ抽出方法。
          service_image_tag() {
            local service_name="$1"
            local image
            image="$(gcloud run services describe "$service_name" \
              --region "$REGION" \
              --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || true)"
            if [[ "$image" == *:* ]]; then
              printf '%s\n' "${image##*:}"
            fi
          }

          # ── API のパス判定は「除外方式」────────────────────────────
          # Dockerfile.api は `COPY . .` でリポジトリ全体をイメージへ焼き込み、
          # api/ 配下は data_cases.py・constants.py・rule_manager.py など
          # ルート直下の共有モジュールを40本以上 import する。そのため
          # 「APIに影響するパス」を列挙する許可リスト方式は構造的に取りこぼす。
          #
          # 危険なのは、判定が OR であるせいで欠陥が普段は表に出ないこと。
          # 同じコミットに api/ の変更が1つでも混ざっていれば true になるため、
          # 取りこぼしは「ルート直下モジュールだけを直した回」にだけ顕在化する。
          # 例: 2026-09-19 の統計キャッシュ修正は data_cases.py と
          # system_guardrails.py が本体だったが、たまたま api/main.py も
          # 含んでいたため旧フィルタでも拾えた。本体2ファイルだけの修正なら
          # 黙ってスキップされていた。
          # しかも判定が外れても deploy ジョブは skipped = 成功で終わるため、
          # ログ上は異常に見えない。
          #
          # よって「APIランタイムに影響しないと証明できるパス」だけを除外し、
          # 残り全部をAPI影響ありとみなす（取りこぼしではなく過剰デプロイ側へ倒す）。
          #
          # 除外に追加するときの基準: そのパスが変わっても Cloud Run 上の FastAPI
          # プロセスの挙動が変わらないと言い切れること。
          # 特に「ルート直下の *.md」を glob で一括除外してはいけない。
          #   api/chat_user_personal_memory.py  → USER.md / MEMORY.md
          #   api/shion_system_self_inspection.py → AGENTS.md / CLAUDE.md / HEARTBEAT.md
          # を実行時に読むため、除外すると同じ事故を逆向きに再発させる。
          path_impacts_api() {
            case "$1" in
              # Next.js ソース。イメージには入るが FastAPI からは実行されない
              frontend/*) return 1 ;;
              # 別アプリ / 退避置き場
              mobile_app/*|_archive/*) return 1 ;;
              # ドキュメント・自動生成レポート・テスト（本番プロセスは読まない）
              docs/*|reports/*|tests/*) return 1 ;;
              # CI・エージェント設定・ローカル定期実行の定義
              .github/*|.claude/*|.agents/*|shared-ai/*|launchd/*) return 1 ;;
              # web 側だけのビルド定義
              cloudbuild.web.yaml) return 1 ;;
            esac
            # 上記以外はすべて API 影響ありとみなす。
            # （api/・scripts/・knowledge_base/・static_data/・components/・
            #   ルート直下の *.py と *.md・依存定義ファイルなど）
            return 0
          }
          path_impacts_frontend() {
            case "$1" in
              frontend/*|cloudbuild.web.yaml)
                return 0 ;;
            esac
            return 1
          }

          api_changed=false
          frontend_changed=false

          api_deployed_sha="$(service_image_tag tune-lease-55-api)"
          web_deployed_sha="$(service_image_tag tune-lease-55-web)"
          echo "Deployed API SHA: ${api_deployed_sha:-unknown}"
          echo "Deployed Web SHA: ${web_deployed_sha:-unknown}"

          if [[ -n "$api_deployed_sha" ]] && git rev-parse --verify --quiet "${api_deployed_sha}^{commit}" >/dev/null; then
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              if path_impacts_api "$file"; then
                api_changed=true
                break
              fi
            done < <(git diff --name-only "${api_deployed_sha}..HEAD")
          else
            # デプロイ済みSHAが特定できない（初回デプロイ／イメージ参照が想定外の形式など）
            # 場合は「差分なし」と誤判定してデプロイし忘れるより安全側に倒す。
            echo "::notice::デプロイ済み API イメージのコミットSHAを特定できませんでした。安全側としてデプロイ対象に含めます。"
            api_changed=true
          fi

          if [[ -n "$web_deployed_sha" ]] && git rev-parse --verify --quiet "${web_deployed_sha}^{commit}" >/dev/null; then
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              if path_impacts_frontend "$file"; then
                frontend_changed=true
                break
              fi
            done < <(git diff --name-only "${web_deployed_sha}..HEAD")
          else
            echo "::notice::デプロイ済み Web イメージのコミットSHAを特定できませんでした。安全側としてデプロイ対象に含めます。"
            frontend_changed=true
          fi

          if [[ "${FORCE_DEPLOY:-}" == "true" ]]; then
            api_changed=true
            frontend_changed=true
          fi

          # 判定が外れて取りこぼしても deploy ジョブは skipped = 成功で終わるため、
          # ログ上は異常に見えない（2026-09-19の事故はこれで気づけなかった）。
          # 「デプロイ済みSHAから進んでいるのに影響なしと判定した」場合だけ警告を出し、
          # 人間がフィルタの取りこぼしに気づけるようにする。差分が本当に除外対象
          # だけのときも鳴るが、鳴らずに落とすより安い。
          warn_if_suspicious_skip() {
            local label="$1" deployed_sha="$2" changed="$3"
            [[ "$changed" == "true" ]] && return 0
            [[ -z "$deployed_sha" ]] && return 0
            local ahead
            ahead="$(git rev-list --count "${deployed_sha}..HEAD" 2>/dev/null || echo 0)"
            if [[ "$ahead" -gt 0 ]]; then
              echo "::warning::${label}: デプロイ済み ${deployed_sha} から ${ahead} コミット進んでいますが、パス判定では影響なしと判断しました。path_impacts_${label}() の除外条件に取りこぼしが無いか確認してください。"
            fi
          }
          warn_if_suspicious_skip api "$api_deployed_sha" "$api_changed"
          warn_if_suspicious_skip frontend "$web_deployed_sha" "$frontend_changed"

          echo "api=$api_changed" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend_changed" >> "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────────────
  # Job 2a: API → tune-lease-55-api
  # ────────────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API (tune-lease-55-api)
    needs: changes
    if: (needs.changes.outputs.api == 'true' || github.event.inputs.force_deploy == 'true') && needs.changes.outputs.wif == 'true'
    runs-on: ubuntu-latest
    # このリポジトリは自動改善パイプラインが1日に何十回もapi/**へpushするため、
    # 前のpushのビルドが終わる前に次のpushが来ることが多い。新しいpushが来たら
    # 古い方のビルドは結果を使われず無駄になるため、Cloud Buildのビルド分課金を
    # 抑えるために古い方をキャンセルする（scripts/lib/submit_cloud_build_and_wait.sh
    # 側でGCP上のCloud Buildも明示キャンセルするようセットで対応済み）。
    concurrency:
      group: deploy-api-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write   # WIF に必須

    env:
      SERVICE_NAME: tune-lease-55-api

    steps:
      - uses: actions/checkout@v7

      # ── GCP 認証 (WIF) ──────────────────────────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          # Alternative: SA Key を使う場合は上2行を削除して下記を有効化
          # credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      # シークレット検証はビルドより前に置く。ビルドの後に置くと、キーの設定漏れや
      # 権限不足が17分のビルドを待たないと分からず、1回の切り分けに17分かかる
      # （2026-09-07、実際にこれで何度も空費した）。
      - name: Preflight - verify API access key secret
        run: |
          set -Eeuo pipefail
          source scripts/lib/require_api_access_key_secret.sh
          require_api_access_key_secret "${PROJECT_ID}" "API" >/dev/null

      # Dockerfile.api は COPY .cloudrun_bundle/ /app/.cloudrun_bundle/ を無条件で
      # 実行するため、ビルドコンテキストに .cloudrun_bundle/ が存在しないと
      # COPY failed: file not found で毎回ビルド自体が失敗する。
      # このワークフローは意図的にデモ/ローカルデータをバンドルしない
      # （上の「Deploy to Cloud Run」コメント参照）ため、package_cloud_run_bundle.sh
      # は使わず、空ディレクトリを用意するだけでよい。start_api_cloud_run.sh の
      # seed_dir は .cloudrun_bundle/data が無ければ何もしないため安全。
      - name: Prepare empty Cloud Run bundle dir
        run: mkdir -p .cloudrun_bundle

      # ── Cloud Build でイメージをビルド ──────────────────────────────
      # ビルド完了待ちの方式は scripts/lib/submit_cloud_build_and_wait.sh 参照
      # （ログバケット読み取りに依存する gcloud builds submit の同期待ちが
      # WIF環境で失敗し続けた問題の回避）。
      - name: Build API image
        run: |
          set -Eeuo pipefail
          source scripts/lib/submit_cloud_build_and_wait.sh

          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${SERVICE_NAME}/${SERVICE_NAME}:${SHORT_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

          submit_cloud_build_and_wait "${PROJECT_ID}" cloudbuild.api.yaml "_IMAGE_URI=${IMAGE_URI}" .

      # ── Cloud Run にデプロイ ─────────────────────────────────────────
      # CLOUDRUN_DATA_MODE=demo / DB_PATH=demo.db は固定しない。デモ用の
      # .cloudrun_bundle はこのワークフローでは作られないため、demo固定は
      # 「本物のDBでもデモDBでもない空のDBで起動する」だけで意味がなく、
      # かつ次回pushのたびに本番設定を上書きしてしまっていた。
      # GitHub Secret CLOUDSQL_INSTANCE があれば Secret Manager の DATABASE_URL
      # を注入し、同じデプロイで Cloud SQL ソケットもマウントする。
      # 未設定なら Cloud SQL は明示的に外し、ローカルDB既定で起動する。
      #
      # インターネット公開するCloud RunはAPIキー必須（fail-closed、scripts/deploy_cloud_run_api.sh
      # と同じ方針）。これが欠けていると api/** への push のたびに未認証で
      # GEMINI_API_KEY 付きAPIが公開され、悪用による課金急増につながる
      # （2026-09の突発的なコスト増の原因調査で判明）。
      - name: Deploy to Cloud Run
        env:
          DATABASE_SECRET_NAME: DATABASE_URL
          CLOUDSQL_INSTANCE: ${{ secrets.CLOUDSQL_INSTANCE }}
        run: |
          set -Eeuo pipefail
          source scripts/lib/require_api_access_key_secret.sh

          deploy_args=(
            run deploy "${SERVICE_NAME}"
            --image "${IMAGE_URI}"
            --project "${PROJECT_ID}"
            --region "${REGION}"
            --execution-environment gen2
            --port 8080
            --memory 4Gi
            --cpu 2
            --cpu-boost
            --timeout 900
            --concurrency 1
            --min-instances 0
            --max-instances 1
            --set-env-vars "DATA_DIR=/app/data,ENABLE_OBSIDIAN_INDEXING=true,ENABLE_FEEDBACK_LOADING=true,ENABLE_GUNSHI_RAG=false,OBSIDIAN_VAULT_PATH=/app/obsidian_vault,USE_GCS_VAULT=true,GCS_VAULT_RESYNC_INTERVAL=3600,SHION_MEMORY_HYBRID=1,REQUIRE_API_ACCESS_KEY=1,TZ=Asia/Tokyo"
            --allow-unauthenticated
          )

          api_access_key_ref="$(require_api_access_key_secret "${PROJECT_ID}" "API")" || exit 1
          secret_args=("GEMINI_API_KEY=GEMINI_API_KEY:latest" "API_ACCESS_KEY=${api_access_key_ref}")

          if [ -n "${CLOUDSQL_INSTANCE}" ]; then
            secret_args+=("DATABASE_URL=${DATABASE_SECRET_NAME}:latest")
            deploy_args+=(--add-cloudsql-instances "${CLOUDSQL_INSTANCE}")
          else
            echo "::warning::GitHub Secret CLOUDSQL_INSTANCE が未設定のため、${DATABASE_SECRET_NAME} は注入せず Cloud SQL も接続しません。DB_PATH既定（data/lease_data.db）で起動します。"
            # --add-cloudsql-instances は明示しない限り前リビジョンの設定を引き継ぐため、
            # 未設定時は古い接続を持ち越さないよう明示的にクリアする。
            deploy_args+=(--clear-cloudsql-instances)
          fi

          IFS=,; deploy_args+=(--set-secrets "${secret_args[*]}"); unset IFS

          gcloud "${deploy_args[@]}"

      - name: Show deployed URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format="value(status.url)"

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          workflow-name: "Deploy to Cloud Run / deploy-api"

  # ────────────────────────────────────────────────────────────────────
  # Job 2b: Frontend → tune-lease-55-web
  # ────────────────────────────────────────────────────────────────────
  deploy-web:
    name: Deploy Frontend (tune-lease-55-web)
    needs: changes
    if: (needs.changes.outputs.frontend == 'true' || github.event.inputs.force_deploy == 'true') && needs.changes.outputs.wif == 'true'
    runs-on: ubuntu-latest
    # deploy-api と同じ理由（上のコメント参照）。frontend側は別サービス・
    # 別Cloud Buildなのでグループもapi側とは独立させる。
    concurrency:
      group: deploy-web-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write

    env:
      SERVICE_NAME: tune-lease-55-web
      API_SERVICE_NAME: tune-lease-55-api

    steps:
      - uses: actions/checkout@v7

      # ── GCP 認証 (WIF) ──────────────────────────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          # credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      # シークレット検証はビルドより前に置く（API側と同じ理由。deploy-api ジョブの
      # 同名ステップのコメント参照）。PUBLIC_TUNNEL_AUTHもここで検証するのは、
      # Web公開がBasic認証ゲート(proxy.ts)前提であり、これが無いと誰も使えない
      # デプロイになってしまうため。
      - name: Preflight - verify API access key secret
        run: |
          set -Eeuo pipefail
          source scripts/lib/require_api_access_key_secret.sh
          source scripts/lib/require_public_tunnel_auth_secret.sh
          require_api_access_key_secret "${PROJECT_ID}" "Web" >/dev/null
          require_public_tunnel_auth_secret "${PROJECT_ID}" "Web" >/dev/null

      # ── API URL を取得（Next.js ビルド時の FASTAPI_URL として渡す） ──
      - name: Resolve API service URL
        run: |
          API_URL="$(gcloud run services describe "${API_SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')"

          if [[ -z "${API_URL}" ]]; then
            echo "ERROR: ${API_SERVICE_NAME} の URL が取得できません" >&2
            exit 1
          fi

          echo "API_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "API_URL=${API_URL}"

      # ── Cloud Build でイメージをビルド ──────────────────────────────
      # ビルド完了待ちの方式は scripts/lib/submit_cloud_build_and_wait.sh 参照
      # （ログバケット読み取りに依存する gcloud builds submit の同期待ちが
      # WIF環境で失敗し続けた問題の回避）。
      - name: Build frontend image
        run: |
          set -Eeuo pipefail
          source scripts/lib/submit_cloud_build_and_wait.sh

          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${SERVICE_NAME}/${SERVICE_NAME}:${SHORT_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

          submit_cloud_build_and_wait "${PROJECT_ID}" cloudbuild.web.yaml "_IMAGE_URI=${IMAGE_URI},_FASTAPI_URL=${API_URL}" frontend/

      # ── Cloud Run にデプロイ ─────────────────────────────────────────
      # Web境界は公開（--allow-unauthenticated）。単純にIAMを外すだけだと、
      # frontend/src/proxy.ts が Web境界のIAM有無に関係なく全ての未認証 /api/* リクエストへ
      # 特権的な API_ACCESS_KEY を代理付与するため、誰でもそのプロキシ経由でAPIの鍵付き
      # エンドポイント（コスト発生するchat・案件削除等）を叩けてしまい、元のコスト急増
      # インシデントと同種の穴を別URLで再現する（Codexレビューで指摘、PR #983 で一度
      # 発生）。そのため PUBLIC_TUNNEL=1 と PUBLIC_TUNNEL_AUTH を必ずセットで配線する。
      # proxy.ts はこの2つが揃っている時、Basic認証（ID: lease）を通らない限り
      # /api/* を含む全パスを401で拒否するため、未認証の第三者はAPIへ到達できない。
      - name: Deploy to Cloud Run
        run: |
          set -Eeuo pipefail
          source scripts/lib/require_api_access_key_secret.sh
          source scripts/lib/require_public_tunnel_auth_secret.sh

          api_access_key_ref="$(require_api_access_key_secret "${PROJECT_ID}" "Web")" || exit 1
          tunnel_auth_ref="$(require_public_tunnel_auth_secret "${PROJECT_ID}" "Web")" || exit 1
          secrets_value="API_ACCESS_KEY=${api_access_key_ref},PUBLIC_TUNNEL_AUTH=${tunnel_auth_ref}"

          # GitHub Actionsの knowledge-sync-health 監視専用シークレット
          # （frontend/src/proxy.ts がBasic認証の代わりにX-Sync-Probe-Keyヘッダで
          # 要求する）。無くてもデプロイは止めない ―― 未設定ならproxy.tsがそのプローブ
          # パスを401にするだけで、安全側に倒れるため。
          # このデプロイ用サービスアカウントは secretmanager.secrets.get を持たず
          # describe が PERMISSION_DENIED になる（API_ACCESS_KEY/PUBLIC_TUNNEL_AUTH の
          # 確認時と同じ）。それを NOT_FOUND と誤認すると実在する秘密も常に配線され
          # ず401化する（DASHBOARD_HEALTH_PROBE_TOKENで2026-09-14に実際に発生した
          # ものと同じ構造のバグ）ため、NOT_FOUND の時だけスキップする。
          knowledge_sync_probe_error="$(gcloud secrets describe KNOWLEDGE_SYNC_PROBE_TOKEN --project "${PROJECT_ID}" 2>&1 >/dev/null)" \
            && knowledge_sync_probe_status=0 || knowledge_sync_probe_status=$?
          if (( knowledge_sync_probe_status == 0 )); then
            secrets_value+=",KNOWLEDGE_SYNC_PROBE_TOKEN=KNOWLEDGE_SYNC_PROBE_TOKEN:latest"
          elif printf '%s' "$knowledge_sync_probe_error" | grep -q 'NOT_FOUND'; then
            echo "Warning: Secret Manager secret KNOWLEDGE_SYNC_PROBE_TOKEN was not found; /api/system/knowledge-sync-health will 401 for the external monitor until it is created." >&2
          else
            echo "Warning: could not verify the KNOWLEDGE_SYNC_PROBE_TOKEN secret before deploying (needs secretmanager.secrets.get). Wiring it anyway; gcloud run deploy --set-secrets will fail if it is truly unusable." >&2
            echo "--- gcloud output ---" >&2
            echo "$knowledge_sync_probe_error" >&2
            secrets_value+=",KNOWLEDGE_SYNC_PROBE_TOKEN=KNOWLEDGE_SYNC_PROBE_TOKEN:latest"
          fi

          # GitHub Actionsの dashboard-data-health 監視専用シークレット
          # （frontend/src/proxy.ts がBasic認証の代わりにX-Dashboard-Health-Probe-Key
          # ヘッダで要求する）。無くてもデプロイは止めない ―― 未設定ならproxy.tsが
          # そのプローブパスを401にするだけで、安全側に倒れるため。
          # このデプロイ用サービスアカウントは secretmanager.secrets.get を持たず
          # describe が PERMISSION_DENIED になる（API_ACCESS_KEY/PUBLIC_TUNNEL_AUTH の
          # 確認時と同じ）。それを NOT_FOUND と誤認すると実在する秘密も常に配線され
          # ず404化する（2026-09-14に実際に発生）ため、NOT_FOUND の時だけスキップする。
          dashboard_health_probe_error="$(gcloud secrets describe DASHBOARD_HEALTH_PROBE_TOKEN --project "${PROJECT_ID}" 2>&1 >/dev/null)" \
            && dashboard_health_probe_status=0 || dashboard_health_probe_status=$?
          if (( dashboard_health_probe_status == 0 )); then
            secrets_value+=",DASHBOARD_HEALTH_PROBE_TOKEN=DASHBOARD_HEALTH_PROBE_TOKEN:latest"
          elif printf '%s' "$dashboard_health_probe_error" | grep -q 'NOT_FOUND'; then
            echo "Warning: Secret Manager secret DASHBOARD_HEALTH_PROBE_TOKEN was not found; /api/dashboard/data-health will 401 for the external monitor until it is created." >&2
          else
            echo "Warning: could not verify the DASHBOARD_HEALTH_PROBE_TOKEN secret before deploying (needs secretmanager.secrets.get). Wiring it anyway; gcloud run deploy --set-secrets will fail if it is truly unusable." >&2
            echo "--- gcloud output ---" >&2
            echo "$dashboard_health_probe_error" >&2
            secrets_value+=",DASHBOARD_HEALTH_PROBE_TOKEN=DASHBOARD_HEALTH_PROBE_TOKEN:latest"
          fi

          deploy_args=(
            run deploy "${SERVICE_NAME}"
            --image "${IMAGE_URI}"
            --project "${PROJECT_ID}"
            --region "${REGION}"
            --execution-environment gen2
            --port 8080
            --memory 2Gi
            --cpu 1
            --timeout 900
            --concurrency 80
            --min-instances 0
            --max-instances 1
            --set-env-vars "FASTAPI_URL=${API_URL},PUBLIC_TUNNEL=1"
            --allow-unauthenticated
            --set-secrets "${secrets_value}"
          )

          gcloud "${deploy_args[@]}"

      - name: Show deployed URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format="value(status.url)"

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          workflow-name: "Deploy to Cloud Run / deploy-web"
