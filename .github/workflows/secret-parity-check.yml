name: Secret Parity Check

# DASHBOARD_HEALTH_PROBE_TOKEN / KNOWLEDGE_SYNC_PROBE_TOKEN は Secret Manager と
# GitHub Actions Secrets の両方に同じ値を手動登録する運用。片方だけ登録・
# ローテーションされると外形監視ワークフローが無言で401落ちし続ける
# （2026-09、DASHBOARD_HEALTH_PROBE_TOKENで実際に発生）ため、値そのものを
# 突き合わせて事前にドリフトを検知する。
#
# 必要なIAM（deploy.ymlのWIFサービスアカウントに追加で必要）:
#   roles/secretmanager.secretAccessor を DASHBOARD_HEALTH_PROBE_TOKEN /
#   KNOWLEDGE_SYNC_PROBE_TOKEN の各シークレットに付与
#   （describe用の secretmanager.secrets.get だけでは値を読めない）。
#   未付与の間はこのチェックが権限不足で該当シークレットをスキップする
#   （fail-closedにはしない。deploy.ymlのdescribe確認と同じ方針）。

on:
  schedule:
    # 毎日 07:00 JST (22:00 UTC)。時間帯プローブ群と重ならない時刻にずらす。
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-parity-check
  cancel-in-progress: true

env:
  PROJECT_ID: gen-lang-client-0420497423

jobs:
  check-secret-parity:
    name: Compare probe token secrets against Secret Manager
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write   # WIF に必須

    steps:
      # WIF Secrets 未設定なら失敗表示を出さずスキップする（deploy.ymlと同じ方針）。
      - id: wif
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        run: |
          if [ -n "${WIF_PROVIDER}" ] && [ -n "${WIF_SERVICE_ACCOUNT}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WIF Secrets (WIF_PROVIDER / WIF_SERVICE_ACCOUNT) が未設定のため secret parity チェックをスキップします。"
          fi

      - uses: actions/checkout@v7
        if: steps.wif.outputs.configured == 'true'

      - name: Authenticate to GCP
        if: steps.wif.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: steps.wif.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - uses: actions/setup-python@v7
        if: steps.wif.outputs.configured == 'true'
        with:
          python-version: "3.11"

      - name: Compare probe token secrets
        if: steps.wif.outputs.configured == 'true'
        env:
          DASHBOARD_HEALTH_PROBE_TOKEN: ${{ secrets.DASHBOARD_HEALTH_PROBE_TOKEN }}
          KNOWLEDGE_SYNC_PROBE_TOKEN: ${{ secrets.KNOWLEDGE_SYNC_PROBE_TOKEN }}
        run: |
          python scripts/check_secret_parity.py \
            --project "${PROJECT_ID}" \
            --secret DASHBOARD_HEALTH_PROBE_TOKEN \
            --secret KNOWLEDGE_SYNC_PROBE_TOKEN

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          workflow-name: "Secret Parity Check"
