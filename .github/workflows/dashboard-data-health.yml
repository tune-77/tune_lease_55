name: Dashboard Data Health

on:
  schedule:
    # 平日のJST 9:17 / 13:17 / 17:17 の1日3回（cronはUTC）。min-instances=0のため
    # このプローブ自体がCloud Run(web→proxy.ts経由でapiまで)のコールドスタートを
    # 毎回誘発する。2026-09のCloud Run費用調査で、旧knowledge-sync-health.yml
    # （2時間おき27分）と合わせ1日12回の起動になっていたため、両チェックを
    # このジョブへ統合し1回の起動で済ませ、業務時間帯のみに絞った。
    - cron: "17 0,4,8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-data-health
  cancel-in-progress: true

jobs:
  check-dashboard-data:
    name: Detect unusable dashboard data and incomplete Vault to ChromaDB sync
    runs-on: ubuntu-latest
    # 知識同期チェックはコールドスタート後のGCS Vault同期＋索引完了を待つため長め。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check production dashboard health
        env:
          DASHBOARD_HEALTH_PROBE_TOKEN: ${{ secrets.DASHBOARD_HEALTH_PROBE_TOKEN }}
        run: |
          python scripts/check_dashboard_stats_health.py \
            --base-url "https://tune-lease-55-web-6mijhyebkq-an.a.run.app" \
            --attempts 3 \
            --retry-delay 10 \
            --timeout 20

      # 旧 knowledge-sync-health.yml を統合。直前のダッシュボードチェックで起動した
      # インスタンスの起動時Vault同期・索引（10分超かかることがある）を待つため、
      # 60秒間隔で最大15回リトライする。
      - name: Check production knowledge sync
        if: ${{ !cancelled() }}
        env:
          KNOWLEDGE_SYNC_PROBE_TOKEN: ${{ secrets.KNOWLEDGE_SYNC_PROBE_TOKEN }}
        run: |
          python scripts/check_cloudrun_knowledge_sync.py \
            --base-url "https://tune-lease-55-web-6mijhyebkq-an.a.run.app" \
            --path "/api/system/knowledge-sync-health" \
            --attempts 15 \
            --retry-delay 60 \
            --timeout 20

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          workflow-name: "Dashboard Data / Knowledge Sync Health"
