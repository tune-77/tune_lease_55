name: Dashboard Data Health

on:
  schedule:
    # 2時間おき17分。min-instances=0のためこのプローブ自体がCloud Run
    # (web→proxy.ts経由でapiまで)のコールドスタートを毎回誘発しており、
    # Cloud Run課金増の一因だったため毎時→2時間おきに頻度を落とした
    # （2026-09、Cloud Run費用調査で判明）。デプロイ直後と重なりにくい
    # 時刻にずらす狙いは維持。
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-data-health
  cancel-in-progress: true

jobs:
  check-dashboard-data:
    name: Detect HTTP 200 with unusable dashboard data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check production dashboard health
        env:
          DASHBOARD_HEALTH_PROBE_TOKEN: ${{ secrets.DASHBOARD_HEALTH_PROBE_TOKEN }}
        run: |
          python scripts/check_dashboard_stats_health.py \
            --base-url "https://tune-lease-55-web-6mijhyebkq-an.a.run.app" \
            --attempts 3 \
            --retry-delay 10 \
            --timeout 20

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          workflow-name: "Dashboard Data Health"
