version: 2

updates:
  # frontend/ (Next.js) の npm 依存
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "frontend"
    commit-message:
      prefix: "chore"
      include: "scope"

  # ルートの Python 依存 (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "backend"
    commit-message:
      prefix: "chore"
      include: "scope"

  # .github/workflows/ で使っている GitHub Actions 自体のバージョン
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
