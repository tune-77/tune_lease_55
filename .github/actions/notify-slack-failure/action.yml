name: Notify Slack on failure
description: >
  secrets.SLACK_WEBHOOK_URL が設定されている場合のみ、失敗したワークフローを
  Slack Incoming Webhook へ通知する。未設定時は何もせず成功扱いで終わる
  （deploy.yml の WIF未設定スキップと同じfail-openの考え方）。

inputs:
  webhook-url:
    description: "Slack Incoming Webhook URL（呼び出し側で secrets.SLACK_WEBHOOK_URL を渡す）"
    required: true
  workflow-name:
    description: "通知に表示するワークフロー名"
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        WORKFLOW_NAME: ${{ inputs.workflow-name }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        if [ -z "${WEBHOOK_URL}" ]; then
          echo "SLACK_WEBHOOK_URL が未設定のため通知をスキップします。"
          exit 0
        fi

        payload=$(jq -n --arg wf "${WORKFLOW_NAME}" --arg url "${RUN_URL}" \
          '{text: (":rotating_light: *" + $wf + "* が失敗しました\n" + $url)}')

        curl -sS -X POST -H "Content-type: application/json" --data "${payload}" "${WEBHOOK_URL}" \
          || echo "::warning::Slack通知の送信に失敗しました（ワークフロー自体の失敗判定には影響しません）"
